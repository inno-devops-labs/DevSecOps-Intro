name: Lab 1 smoke test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      juice-shop:
        image: bkimminich/juice-shop:v20.0.0
        ports:
          - 3000:3000
    steps:
      - name: Wait for Juice Shop (up to 60 s)
        run: |
          deadline=$((SECONDS + 60))
          until curl --silent --fail --max-time 5 http://localhost:3000/rest/admin/application-version; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Juice Shop did not return 200 within 60 s" >&2
              exit 1
            fi
            echo "not ready yet (${SECONDS}s), retrying..."
            sleep 3
          done
          echo
          echo "Juice Shop is up after ${SECONDS}s"
