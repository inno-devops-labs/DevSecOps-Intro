name: Lab 1 smoke test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:v20.0.0
        ports:
          - 3000:3000
    steps:
      - name: Wait for Juice Shop to answer
        run: |
          for i in $(seq 1 12); do
            if curl --silent --fail http://localhost:3000/rest/admin/application-version; then
              echo "Juice Shop is up"
              exit 0
            fi
            echo "Not ready yet, waiting 5s (attempt $i/12)..."
            sleep 5
          done
          echo "Juice Shop did not become healthy within 60 seconds"
          exit 1
