name: Lab 1 - Juice Shop smoke test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.0.0

      - name: Wait up to 60 seconds for HTTP 200
        shell: bash
        run: |
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if status=$(curl --silent --fail --max-time "$remaining" \
              --output /tmp/juice-shop-version.json --write-out '%{http_code}' \
              http://localhost:3000/rest/admin/application-version); then
              if [[ "$status" == "200" ]]; then
                printf 'HTTP %s\n' "$status"
                cat /tmp/juice-shop-version.json
                printf '\nReady after %s seconds\n' "$SECONDS"
                exit 0
              fi
            fi
            if (( SECONDS < deadline )); then sleep 1; fi
          done
          echo 'Juice Shop did not return HTTP 200 within 60 seconds.' >&2
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs juice-shop

      - name: Stop the container
        if: always()
        run: docker stop juice-shop
