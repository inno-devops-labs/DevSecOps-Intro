name: lab1-smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:v20.0.0
        ports:
          - 3000:3000
    steps:
      - name: Wait for Juice Shop and check version
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/rest/admin/application-version; then
              echo
              echo "Smoke OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Juice Shop did not become healthy within 60s"
          exit 1
