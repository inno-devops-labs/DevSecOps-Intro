repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        # Lab 4 requires committing these generated SBOM/attestation artifacts.
        exclude: ^labs/lab4/juice-shop\.(cdx|spdx)\.json$|^labs/lab4/juice-shop-attestation\.json$
