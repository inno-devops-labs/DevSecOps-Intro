services:
  juice:
    image: bkimminich/juice-shop:v20.0.0
    restart: unless-stopped
    expose:
      - "3000"

  waf:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    depends_on:
      - juice
    ports:
      - "8443:8443"
    environment:
      BACKEND: http://juice:3000
      PORT: "8080"
      SSL_PORT: "8443"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      BLOCKING_PARANOIA: "1"
      MODSEC_RULE_ENGINE: "On"
    volumes:
      - ./waf/logs:/var/log/modsecurity:rw

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - juice
    ports:
      - "80:80"     # HTTP (redirects to HTTPS)
      - "443:443"   # HTTPS
      # On rootless Docker or if 80/443 are taken, remap (e.g. "8080:80","8443:443")
      # and adjust the verification URLs accordingly.
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx:rw
