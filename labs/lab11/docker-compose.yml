services:
  juice:
    image: bkimminich/juice-shop:v20.0.0
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - juice
    ports:
      # 80/443 by default; set LAB11_HTTP_PORT / LAB11_HTTPS_PORT if they are taken
      - "${LAB11_HTTP_PORT:-80}:80"     # HTTP (redirects to HTTPS)
      - "${LAB11_HTTPS_PORT:-443}:443"  # HTTPS
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx:rw
