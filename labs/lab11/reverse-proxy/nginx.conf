user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  10;
  server_tokens off;
  gzip off;

  # Security-focused logs
  log_format security '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'urt=$upstream_response_time';
  access_log /var/log/nginx/access.log security;
  error_log  /var/log/nginx/error.log warn;

  # CSP violation reports, one JSON object per line
  log_format csp_report escape=json '{"time":"$time_iso8601","addr":"$remote_addr",'
                                    '"ua":"$http_user_agent","report":"$request_body"}';

  # Upstream app
  upstream juice {
    server juice:3000;
    keepalive 32;
  }

  # Rate limit zone for login
  # ~10 req/min per IP, burst of 5
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  # CSP report endpoint is unauthenticated and writes to disk; cap it too
  limit_req_zone $binary_remote_addr zone=csp:1m rate=30r/m;
  limit_req_status 429;

  # Concurrent connections per client address. Applies to every server below.
  # Over HTTP/2 each in-flight stream counts as one connection.
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_conn perip 20;
  limit_conn_status 429;
  limit_conn_log_level warn;

  # Empty Connection header (not "close") when there is no Upgrade, so the
  # upstream keepalive pool above is actually used
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  # Common proxy settings
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # This is the first hop: overwrite rather than append to whatever the client sent
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  # Prevent upstream TLS BREACH vector by disabling compression from upstream
  proxy_set_header Accept-Encoding "";
  # Timeouts between nginx and Juice Shop
  proxy_connect_timeout 5s;   # TCP connect to upstream; a dead backend fails fast
  proxy_send_timeout 30s;     # gap between two writes of the request to upstream
  proxy_read_timeout 30s;     # gap between two reads of the response; a hung backend frees the worker
  proxy_hide_header X-Powered-By;
  # Hide upstream headers to avoid duplicates and enforce policy at the proxy
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  # Legacy predecessor of Permissions-Policy; Juice Shop sends "payment 'self'"
  proxy_hide_header Feature-Policy;
  # Content-Security-Policy is deliberately NOT hidden: Juice Shop enforces one on
  # /profile, and stripping it would leave that page with only our report-only policy
  proxy_hide_header Content-Security-Policy-Report-Only;
  proxy_hide_header Access-Control-Allow-Origin;

  # HTTP server (redirect to HTTPS)
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Core headers (also on redirects). No HSTS: browsers ignore it over HTTP.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # 308 keeps the method and body: a POST to /rest/user/login stays a POST
    return 308 https://$host$request_uri;
  }

  # Internal sink for CSP reports; only reachable from inside this container
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location / { return 204; }
  }

  # HTTPS server
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;
    # Ticket keys live for the life of the worker; leaking one breaks forward secrecy
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 suites only: ECDHE + AES-GCM. ssl_ciphers has no effect on TLS 1.3.
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    # TLS 1.3 suites: AES-GCM only, CHACHA20-POLY1305 removed (nginx 1.19.4+, OpenSSL 1.1.1+)
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers on;
    # Self-signed certificate: no issuer, no AIA/OCSP URL, nothing to staple
    ssl_stapling off;
    # If using a publicly-trusted certificate, you may enable OCSP stapling:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;
    # ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    client_max_body_size 2m;
    client_body_timeout 10s;     # gap between two reads of the request body (slow POST)
    client_header_timeout 10s;   # whole request header must arrive within this (slowloris)
    keepalive_timeout 10s;       # idle keep-alive connection is closed after this
    send_timeout 10s;            # gap between two writes to a client that stopped reading

    # Security headers (include HSTS here only). No preload: it is effectively
    # irreversible and this is localhost with a self-signed certificate.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # The policy we want to enforce, in report-only mode until the reports are clean
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /csp-report" always;

    # Not `location = /rest/user/login`: Express routes are case-insensitive and
    # accept a trailing slash, so /REST/user/login and /rest/user/login/ reach
    # the same handler and would skip an exact, case-sensitive match
    location ~* ^/rest/user/login/?$ {
      limit_req zone=login burst=5 nodelay;
      limit_req_log_level warn;
      proxy_pass http://juice;
    }

    location = /csp-report {
      limit_except POST { deny all; }
      limit_req zone=csp burst=20 nodelay;
      client_max_body_size 16k;
      client_body_buffer_size 16k;
      access_log /var/log/nginx/csp-report.log csp_report;
      proxy_pass http://127.0.0.1:8081;
    }

    location / {
      proxy_pass http://juice;
    }
  }
}
