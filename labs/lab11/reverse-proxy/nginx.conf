events {
  worker_connections 1024;
}

http {
  # TASK 2: Zones for Rate Limiting & Connection Limits (must be in http block)
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # 1. HTTP server on 80 redirects to HTTPS 443
  server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  # 2. HTTPS server on 443
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # TASK 2: Cipher hardening, Session Settings & OCSP Stapling
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # (Optional in lab; mandatory in prod) OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    # TASK 2: Connection Limits & Client Timeouts (Fail-closed)
    limit_conn conn 50;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # TASK 1: Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # TASK 2: Specific Location for Auth Endpoints (Rate Limiting)
    location /rest/user/login {
      limit_req zone=login burst=5 nodelay;

      proxy_pass http://juice:3000;

      # TASK 2: Proxy Timeouts
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Upstream proxy to Juice Shop (Catch-all for everything else)
    location / {
      proxy_pass http://juice:3000;

      # TASK 2: Proxy Timeouts
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
