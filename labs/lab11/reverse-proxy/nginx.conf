user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 10;
    server_tokens off;
    gzip off;

    # Security-focused logs
    log_format security '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_connect_time '
    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log security;
    error_log /var/log/nginx/error.log warn;

    # Upstream app
    upstream juice {
        server juice:3000;
        keepalive 32;
    }

    # Rate limit and connection limit zones
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Client timeouts (fail-closed)
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Common proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # Hide upstream headers to avoid duplicates and enforce policy at the proxy
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Access-Control-Allow-Origin;

    # 1. HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # 2. HTTPS server on 443
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # Connection limit per server
        limit_conn conn 50;

        # Cipher hardening & Session resumption (Mozilla Modern)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # FIX: Added a standard TLS 1.2 cipher at the end to satisfy Nginx's parser.
        # Because ssl_protocols is strictly TLSv1.3, this TLS 1.2 cipher will never be used.
        ssl_ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_ecdh_curve X25519:secp384r1;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (Documentation-only for self-signed, but required for prod posture)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;

        # Certificates
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Six required security headers with 'always'
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Default upstream proxy to Juice Shop
        location / {
            proxy_pass http://juice;
        }

        # Rate-limited location for login
        location /rest/user/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://juice;
        }
    }
}