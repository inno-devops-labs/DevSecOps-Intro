user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  client_body_timeout 10s;
  client_header_timeout 10s;
  proxy_read_timeout 30s;
  proxy_connect_timeout 5s;

  upstream juice {
    server juice:3000;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host$request_uri;
  }

  # Internal HTTP for WAF sidecar (docker network only, not exposed to host)
  server {
    listen 8080;
    server_name _;

    location / {
      proxy_pass http://juice;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    limit_conn conn 50;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;

    location = /rest/user/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://juice;
    }

    location / {
      proxy_pass http://juice;
    }
  }
}
