user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip off;

  # Security-focused logs
  log_format security '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'urt=$upstream_response_time';
  access_log /var/log/nginx/access.log security;
  error_log  /var/log/nginx/error.log warn;

  # Upstream app
  upstream juice {
    server juice:3000;
    keepalive 32;
  }

  # ---- Availability controls -------------------------------------------------
  # Login only: 10 req/min per client address, burst 5 served without delay,
  # everything beyond that is rejected with 429 (not the default 503).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  # At most 20 concurrent connections (HTTP/2: concurrent requests) per address.
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_conn_status 429;
  limit_conn_log_level warn;

  # Client-side timeouts (slowloris / slow-POST protection), set for both servers
  client_header_timeout 10s;   # whole request header must arrive within 10s
  client_body_timeout   10s;   # max gap between two reads of the request body
  send_timeout          10s;   # max gap between two writes of the response
  keepalive_timeout     10s;   # idle keep-alive connections are closed after 10s
  client_max_body_size  2m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Common proxy settings
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  # Prevent upstream TLS BREACH vector by disabling compression from upstream
  proxy_set_header Accept-Encoding "";

  # Upstream timeouts, explicit
  proxy_connect_timeout 5s;    # TCP connect to Juice Shop
  proxy_send_timeout    30s;   # max gap between two writes of the request to upstream
  proxy_read_timeout    30s;   # max gap between two reads of the upstream response

  proxy_hide_header X-Powered-By;
  # Hide upstream headers to avoid duplicates and enforce policy at the proxy
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Content-Security-Policy-Report-Only;
  proxy_hide_header Access-Control-Allow-Origin;

  # HTTP server: everything goes to HTTPS with a permanent redirect
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    limit_conn perip 20;

    # Core headers (also on redirects); HSTS is ignored over plain HTTP, so only on 443
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;

    # 308, not 301: keeps the method and body (a POST stays a POST)
    return 308 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 1.2 suites: ECDHE + AES-GCM only.
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_prefer_server_ciphers on;
    # TLS 1.3 suites: ssl_ciphers does NOT apply to 1.3. AES-GCM only, CHACHA20 dropped.
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;

    # OCSP stapling stays off: the certificate is self-signed and has no OCSP responder.
    ssl_stapling off;
    # With a publicly-trusted certificate:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;
    # ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    limit_conn perip 20;

    # Security headers, all with `always` so they survive 4xx/5xx
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;

    # Rate limit applies to the login endpoint only
    location = /rest/user/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://juice;
    }

    location / {
      proxy_pass http://juice;
    }
  }
}
