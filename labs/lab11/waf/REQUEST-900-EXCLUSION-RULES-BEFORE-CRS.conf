# Juice Shop exclusions for OWASP CRS 4.30, loaded before the CRS rules.
# Each one fixes a false positive observed in the lab and is scoped to the
# path where it was observed. Nothing here disables a rule site-wide.

# FP 1 (911100 "Method is not allowed by policy"): the REST API uses
# PUT/PATCH/DELETE (product reviews, basket items, addresses). CRS 4 allows
# only GET HEAD POST OPTIONS by default.
SecRule REQUEST_FILENAME "@rx ^/(?:rest|api)/" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# FP 2 (920420 "Request content type is not allowed by policy"): socket.io
# long-polling POSTs "text/plain;charset=UTF-8". CRS default list plus
# text/plain, on this path only.
SecRule REQUEST_FILENAME "@streq /socket.io/" \
    "id:1001,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

# FP 3 (932260 "Remote Command Execution: Direct Unix Command Execution"):
# "whoami" in /rest/user/whoami is the endpoint name. 932260 stops looking at
# the path for this one URL; arguments, headers and body are still inspected.
SecRule REQUEST_FILENAME "@streq /rest/user/whoami" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=932260;REQUEST_FILENAME"
