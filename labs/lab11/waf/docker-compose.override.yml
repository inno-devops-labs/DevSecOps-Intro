services:
  waf:
    image: owasp/modsecurity-crs:nginx@sha256:88c42590d8242eb48f53af309013642793152d4a5e4a16f8a74c2bcc9c840a1b
    restart: unless-stopped
    depends_on:
      - juice
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      BACKEND: http://juice:3000
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /dev/stdout
