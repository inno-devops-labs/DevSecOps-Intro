services:
  waf:
    image: owasp/modsecurity-crs:nginx@sha256:133267aa811e1a57a23b52ef04b3c30e802bcbe5454588f6d6af1f69f4b2b667
    restart: unless-stopped
    depends_on:
      - juice
    environment:
      BACKEND: "http://juice:3000"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_LOG_TYPE: "Serial"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      SERVER_TOKENS: "off"
    ports:
      - "127.0.0.1:8090:8080"
