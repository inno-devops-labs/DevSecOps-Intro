# ModSecurity configuration override

# Enable ModSecurity
SecRuleEngine On

# Include CRS setup
Include /etc/modsecurity/crs/crs-setup.conf

# Include CRS rules
Include /etc/modsecurity/crs/rules/*.conf

# Override some settings
SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLog /var/log/modsec/audit.log
SecAuditLogType Serial

# Set paranoia level (1 = production safe)
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"

# Anomaly scoring thresholds
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"

# Enable blocking
SecAction "id:900002,phase:1,nolog,pass,t:none,setvar:tx.anomaly_score_blocking=on"

# Static file exclusions
SecRule REQUEST_FILENAME "@rx \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2|ttf|eot|map|json)$" \
    "id:900015,phase:1,nolog,pass,t:none,ctl:ruleEngine=DetectionOnly"

# Increase request body limit for Juice Shop
SecAction "id:900016,phase:1,nolog,pass,t:none,setvar:tx.limit_request_body=131072"