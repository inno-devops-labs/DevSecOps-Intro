threagile_version: 1.0.0

title: Juice Shop Auth Flow Model

date: 2025-09-18

author:
  name: Student Name
  homepage: https://example.edu

management_summary_comment: >
  Feature-level threat model of Juice Shop's authentication flow: a user
  submits credentials to the login endpoint, which verifies them against
  the credential store and asks the token service to issue a signed JWT.
  The browser then presents that token to reach both ordinary and admin
  endpoints, with the token service verifying signature and validity on
  every sensitive call.

business_criticality: critical

business_overview:
  description: >
    Authentication and session-token handling for OWASP Juice Shop. This
    model isolates only the login path and the admin-access path so that
    risks specific to identity, token issuance and authorization can be
    analyzed independently of the broader application architecture.
  images:

technical_overview:
  description: >
    The browser submits a username/password to the Login Endpoint over
    HTTPS. The Login Endpoint checks the credentials against the
    Credential Store and, if valid, asks the Token Service to issue a
    JWT signed with a dedicated signing key. The browser then attaches
    that JWT to later requests, including calls to the Admin Endpoint,
    which asks the Token Service to verify the token's signature and
    the caller's role before allowing access.
  images: []

questions:
  Is the JWT signing key rotated?: ""
  Is there a lockout policy on the login endpoint?: ""
  Does the admin endpoint check role claims, not just token validity?: ""

abuse_cases:
  Credential Stuffing / Brute Force: >
    Attackers submit large volumes of username/password guesses against
    the login endpoint to take over accounts or exhaust resources.
  JWT Signing Key Compromise: >
    An attacker who obtains the JWT signing key can forge arbitrary
    tokens, including ones claiming admin privileges.
  Admin Endpoint Privilege Escalation: >
    A regular authenticated user attempts to reach the admin endpoint
    with a valid but non-privileged token, relying on a missing or
    incomplete authorization check.

security_requirements:
  Token integrity: The JWT signing key must be stored and handled separately from application code, never logged, and rotated periodically.
  Server-side authorization: Every sensitive endpoint, especially admin functionality, must verify role/claims server-side, not just token validity.
  Credential hashing: User credentials must be stored only as salted, strong password hashes, never in plaintext.
  Rate limiting & lockouts: The login endpoint must apply rate limiting and lockout policies to resist brute-force and credential-stuffing attacks.

tags_available:
  - actor
  - user
  - auth
  - tokens
  - pii
  - admin
  - app

# =========================
# DATA ASSETS
# =========================
data_assets:

  Login Credentials:
    id: login-credentials
    description: "Username and password submitted by the user at login time."
    usage: business
    tags: ["pii", "auth"]
    origin: user-supplied
    owner: Lab Owner
    quantity: many
    confidentiality: strictly-confidential
    integrity: critical
    availability: operational
    justification_cia_rating: >
      Raw credentials in transit are extremely sensitive; disclosure directly enables account takeover.

  User Credential Hashes:
    id: user-credential-hashes
    description: "Salted password hashes and account identifiers persisted in the credential store."
    usage: business
    tags: ["pii", "auth"]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: >
      Compromise allows offline cracking of passwords; integrity is critical to prevent silent account takeover via hash replacement.

  JWT Access Token:
    id: jwt-access-token
    description: "Signed JWT issued after successful login, carrying user identity and role claims."
    usage: business
    tags: ["auth", "tokens"]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: >
      Anyone holding a valid token can act as the user; integrity of its claims (especially role) is critical to prevent privilege escalation.

  JWT Signing Key:
    id: jwt-signing-key
    description: "Secret key used by the Token Service to sign and verify JWTs."
    usage: devops
    tags: ["auth"]
    origin: application
    owner: Lab Owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: critical
    justification_cia_rating: >
      Compromise of this key lets an attacker forge arbitrary tokens, including admin-role tokens, defeating authentication entirely.

# =========================
# TECHNICAL ASSETS
# =========================
technical_assets:

  User Browser:
    id: user-browser
    description: "End-user web browser (client) driving the login and admin flows."
    type: external-entity
    usage: business
    used_as_client_by_human: true
    out_of_scope: false
    justification_out_of_scope:
    size: system
    technology: browser
    tags: ["actor", "user"]
    internet: true
    machine: virtual
    encryption: none
    owner: External User
    confidentiality: public
    integrity: operational
    availability: operational
    justification_cia_rating: "Client controlled by end user (potentially an attacker)."
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed:
      - login-credentials
      - jwt-access-token
    data_assets_stored:
      - jwt-access-token
    data_formats_accepted:
      - json
    communication_links:
      Submit Credentials:
        target: login-endpoint
        description: "Browser posts username/password to the login endpoint."
        protocol: https
        authentication: credentials
        authorization: enduser-identity-propagation
        tags: ["auth"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - login-credentials
        data_assets_received:
          - jwt-access-token
      Access Admin API:
        target: admin-endpoint
        description: "Browser presents the JWT to reach the admin endpoint."
        protocol: https
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["auth", "admin"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - jwt-access-token
        data_assets_received: []

  Login Endpoint:
    id: login-endpoint
    description: "Juice Shop route that accepts login attempts and starts token issuance."
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: web-service-rest
    tags: ["app", "auth"]
    internet: false
    machine: container
    encryption: none
    owner: Lab Owner
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Gatekeeper for authentication; a flaw here compromises every account."
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - login-credentials
      - jwt-access-token
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:
      Verify Credentials:
        target: credential-store
        description: "Login endpoint checks submitted credentials against stored hashes."
        protocol: sql-access-protocol-encrypted
        authentication: credentials
        authorization: technical-user
        tags: ["auth"]
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
          - login-credentials
        data_assets_received:
          - user-credential-hashes
      Request Token Issuance:
        target: token-service
        description: "On successful credential check, login endpoint asks the token service to issue a JWT."
        protocol: https
        authentication: client-certificate
        authorization: technical-user
        tags: ["auth"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent: []
        data_assets_received:
          - jwt-access-token

  Token Service:
    id: token-service
    description: "Issues and verifies JWTs using a dedicated signing key."
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: web-service-rest
    tags: ["app", "auth"]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: critical
    justification_cia_rating: "Holds the JWT signing key; compromise breaks authentication for the entire application."
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - jwt-access-token
      - jwt-signing-key
    data_assets_stored:
      - jwt-signing-key
    data_formats_accepted:
      - json
    communication_links: {}

  Admin Endpoint:
    id: admin-endpoint
    description: "Sensitive administrative API (e.g., user/order management) requiring an authorization check beyond a valid token."
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: web-service-rest
    tags: ["app", "admin"]
    internet: false
    machine: container
    encryption: none
    owner: Lab Owner
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Exposes privileged operations; must reject valid tokens that lack the admin role claim."
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - jwt-access-token
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:
      Verify Token And Role:
        target: token-service
        description: "Admin endpoint asks the token service to verify JWT signature and validity before checking the role claim locally."
        protocol: https
        authentication: token
        authorization: technical-user
        tags: ["auth", "admin"]
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
          - jwt-access-token
        data_assets_received: []

  Credential Store:
    id: credential-store
    description: "Datastore holding salted password hashes for all accounts."
    type: datastore
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: database
    tags: ["auth", "pii"]
    internet: false
    machine: virtual
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Bulk store of credential hashes; compromise enables offline password cracking for every account."
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: []
    data_assets_stored:
      - user-credential-hashes
    data_formats_accepted:
      - file
    communication_links: {}

# =========================
# TRUST BOUNDARIES
# =========================
trust_boundaries:

  Internet:
    id: internet
    description: "Untrusted public network (Internet)."
    type: network-dedicated-hoster
    tags: []
    technical_assets_inside:
      - user-browser
    trust_boundaries_nested:
      - app-boundary

  App Boundary:
    id: app-boundary
    description: "Trusted backend boundary containing the authentication and admin services."
    type: network-dedicated-hoster
    tags: []
    technical_assets_inside:
      - login-endpoint
      - token-service
      - admin-endpoint
      - credential-store
    trust_boundaries_nested: []

# =========================
# SHARED RUNTIMES
# =========================
shared_runtimes:

  Auth Services Runtime:
    id: auth-services-runtime
    description: "Container runtime hosting the auth-related services."
    tags: []
    technical_assets_running:
      - login-endpoint
      - token-service
      - admin-endpoint

# =========================
# INDIVIDUAL RISK CATEGORIES (optional)
# =========================
individual_risk_categories: {}

# =========================
# RISK TRACKING (optional)
# =========================
risk_tracking: {}
