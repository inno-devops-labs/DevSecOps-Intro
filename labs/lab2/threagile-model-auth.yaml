threagile_version: 1.0.0

title: Juice Shop Login Flow
date: 2026-09-14

author:
  name: Student Name
  homepage: https://example.edu

management_summary_comment: >
  Small feature-level threat model for the OWASP Juice Shop login path. The model
  focuses on credentials, JWT issuing, JWT verification and access to the admin endpoint.

business_criticality: important

business_overview:
  description: >
    Users authenticate to Juice Shop and receive a JWT token. Admin users can call
    the admin endpoint only after token verification and authorization checks.
  images: []

technical_overview:
  description: >
    Browser sends credentials to the login endpoint. The login endpoint checks the
    credential store, asks the token service to issue a JWT signed with a signing key,
    and later the admin endpoint verifies the token through the authorization check.
  images: []

questions:
  Are JWT signing keys rotated?: "No rotation is modeled in this lab."
  Are admin routes protected server-side?: "Yes, through the authorization check asset."

abuse_cases:
  Credential stuffing: >
    An attacker repeatedly submits passwords to the login endpoint.
  JWT forgery: >
    An attacker tries to guess or steal the JWT signing key and create admin tokens.
  Broken access control: >
    An attacker calls the admin endpoint without a valid admin authorization decision.

security_requirements:
  Protect JWT signing key: Store the signing key in a managed secret store and rotate it.
  Enforce authorization: The admin endpoint must trust only server-side authorization decisions.
  Rate limit login: Apply throttling and lockout for repeated failed login attempts.

tags_available:
  - browser
  - login
  - auth
  - jwt
  - admin
  - secrets
  - database
  - endpoint
  - docker

data_assets:

  User Credentials:
    id: user-credentials
    description: "Email and password submitted during login."
    usage: business
    tags: ["auth"]
    origin: user-supplied
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Credentials must stay secret and correct to prevent account takeover."

  User Accounts:
    id: auth-user-accounts
    description: "Account records with roles and password hashes."
    usage: business
    tags: ["auth", "database"]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Account and role integrity is required for authentication and authorization."

  JWT Token:
    id: jwt-token
    description: "Signed session token returned to the browser."
    usage: business
    tags: ["jwt", "auth"]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "A stolen or modified token can give access to user or admin functions."

  JWT Signing Key:
    id: jwt-signing-key
    description: "Secret key used to sign and verify JWT tokens."
    usage: business
    tags: ["secrets", "jwt"]
    origin: application
    owner: Lab Owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: important
    justification_cia_rating: "If this key is leaked or changed, attackers can forge valid tokens."

  Admin Data:
    id: admin-data
    description: "Administrative data returned by the admin endpoint."
    usage: business
