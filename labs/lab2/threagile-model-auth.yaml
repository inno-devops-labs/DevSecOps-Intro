# Authored from output-auth/threagile-stub-model.yaml; not derived from the baseline.
threagile_version: "1.0.0"
title: "Juice Shop Login Flow"
date: "2026-09-11"
author:
  name: "Lab 2 Student"
management_summary_comment: "Feature-level teaching model authored from the generated Threagile stub. Logical components represent responsibilities within one Juice Shop process, not separately deployed services. Controls describe intended checks, not verified implementation security."
business_criticality: "important"
business_overview:
  description: "Authenticate a shopper and authorize administrative access."
  images: []
technical_overview:
  description: "The browser submits credentials to login. Login queries the embedded credential store and calls the JWT issuer only after a successful password check. The browser presents a JWT to verification middleware; only a verified administrator identity reaches the admin handler. Issuing, verification, login, the handler and SQLite share the application runtime. sql-access-protocol represents logical SQLite queries, not a remote database listener. The issuer uses a private signing key; the verifier uses a public verification key."
  images: []
questions:
  Are signature algorithm, issuer, audience and expiry checks correctly implemented?: "Not verified; this is a threat-model exercise."
  Is the admin role checked for every request before the handler?: "Required by the modeled guard; must be verified in application code and negative tests."
abuse_cases:
  Credential query injection: "Attacker-controlled login input changes a database query and bypasses authentication."
  Token forgery: "An attacker steals the signing key or exploits incomplete JWT verification to impersonate an administrator."
  Privilege escalation: "A non-admin attempts to reach the admin handler using an ordinary or modified JWT."
security_requirements:
  Credential validation: "Parameterize credential queries and verify the password before invoking the issuer."
  JWT verification: "Pin the signature algorithm and trusted verification key; validate issuer, audience and expiry."
  Admin authorization: "The Token Verifier to Admin Endpoint link must deny access unless the verified identity has the admin role; no browser-to-admin bypass is modeled."
  Key protection: "Keep the private signing key accessible only to the issuer; never send it to the browser or verifier."
