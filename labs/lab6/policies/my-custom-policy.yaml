metadata:
  id: "CKV_AWS_CUSTOM_RDS_BACKUP_7D"
  name: "Ensure RDS backup_retention_period is at least 7 days (org RPO)"
  category: "BACKUP_AND_RECOVERY"
  severity: "HIGH"
scope:
  provider: aws
definition:
  cond_type: "attribute"
  resource_types:
    - "aws_db_instance"
  attribute: "backup_retention_period"
  operator: "greater_than_or_equal"
  value: 7
