metadata:
  id: "CKV2_CUSTOM_1"
  name: "Ensure all RDS instances have storage encryption enabled"
  category: "ENCRYPTION"
  severity: "HIGH"

definition:
  not:
    cond_type: "attribute"
    resource_types:
      - "aws_db_instance"
    attribute: "storage_encrypted"
    operator: "equals"
    value: false
