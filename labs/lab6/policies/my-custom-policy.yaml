metadata:
  id: "CKV2_CUSTOM_1"
  name: "Ensure every RDS instance carries a data_classification tag"
  category: "GENERAL_SECURITY"
  severity: "HIGH"
definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      value:
        - "aws_db_instance"
      operator: "within"
    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "tags.data_classification"
      operator: "exists"
