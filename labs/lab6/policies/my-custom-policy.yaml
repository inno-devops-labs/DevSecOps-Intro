metadata:
  id: "CKV2_CUSTOM_1"
  name: "Ensure S3 buckets have lifecycle configuration"
  category: "BACKUP_AND_RECOVERY"
  severity: "MEDIUM"
definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      value:
        - "aws_s3_bucket"
      operator: "within"
    - cond_type: "connection"
      resource_types:
        - "aws_s3_bucket"
      connected_resource_types:
        - "aws_s3_bucket_lifecycle_configuration"
      operator: "exists"
