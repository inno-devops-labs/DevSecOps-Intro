apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: seed-runtime-files
        image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
        command:
        - /nodejs/bin/node
        - -e
        - 'const fs = require(''node:fs''); const paths = {"data": "/juice-shop/data",
          "ftp": "/juice-shop/ftp", "logs": "/juice-shop/logs", "i18n": "/juice-shop/i18n",
          "frontend": "/juice-shop/frontend/dist/frontend", "well-known": "/juice-shop/.well-known"};
          for (const [name, source] of Object.entries(paths)) { fs.cpSync(source,
          ''/seed/'' + name, { recursive: true }); }'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /seed/data
        - name: ftp
          mountPath: /seed/ftp
        - name: logs
          mountPath: /seed/logs
        - name: i18n
          mountPath: /seed/i18n
        - name: frontend
          mountPath: /seed/frontend
        - name: well-known
          mountPath: /seed/well-known
      containers:
      - name: juice-shop
        image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /juice-shop/data
        - name: ftp
          mountPath: /juice-shop/ftp
        - name: logs
          mountPath: /juice-shop/logs
        - name: i18n
          mountPath: /juice-shop/i18n
        - name: frontend
          mountPath: /juice-shop/frontend/dist/frontend
        - name: well-known
          mountPath: /juice-shop/.well-known
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 256Mi
      - name: ftp
        emptyDir:
          sizeLimit: 256Mi
      - name: logs
        emptyDir:
          sizeLimit: 256Mi
      - name: i18n
        emptyDir:
          sizeLimit: 256Mi
      - name: frontend
        emptyDir:
          sizeLimit: 256Mi
      - name: well-known
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
