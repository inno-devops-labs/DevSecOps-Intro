apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Paths below come from `docker diff` on a running container. The first
      # four already hold files shipped in the image, so an empty volume would
      # hide them; the initContainer copies the image's content into the
      # volumes before the app starts. i18n/ and logs/ ship empty.
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: frontend
          emptyDir:
            sizeLimit: 128Mi
        - name: ftp
          emptyDir:
            sizeLimit: 16Mi
        - name: csaf
          emptyDir:
            sizeLimit: 4Mi
        - name: i18n
          emptyDir:
            sizeLimit: 16Mi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
      initContainers:
        - name: seed
          # Same image, same digest: the seed is exactly what the app expects.
          # The image is distroless (no sh, no cp), so copy with node itself.
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          command: ["/nodejs/bin/node", "-e"]
          args:
            - |
              const fs = require('fs')
              for (const d of ['data', 'frontend', 'ftp', 'csaf']) {
                const src = { data: '/juice-shop/data', frontend: '/juice-shop/frontend/dist/frontend',
                              ftp: '/juice-shop/ftp', csaf: '/juice-shop/.well-known/csaf' }[d]
                fs.cpSync(src, '/seed/' + d, { recursive: true })
                console.log('seeded', src)
              }
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /seed/data
            - name: frontend
              mountPath: /seed/frontend
            - name: ftp
              mountPath: /seed/ftp
            - name: csaf
              mountPath: /seed/csaf
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /juice-shop/data
            - name: frontend
              mountPath: /juice-shop/frontend/dist/frontend
            - name: ftp
              mountPath: /juice-shop/ftp
            - name: csaf
              mountPath: /juice-shop/.well-known/csaf
            - name: i18n
              mountPath: /juice-shop/i18n
            - name: logs
              mountPath: /juice-shop/logs
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
