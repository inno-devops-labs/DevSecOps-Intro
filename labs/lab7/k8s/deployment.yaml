apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the image's own user (docker inspect .Config.User)
        runAsGroup: 65532
        fsGroup: 65532            # lets uid 65532 write the emptyDir volumes below
        seccompProfile:
          type: RuntimeDefault
      # Bonus: three dirs both ship files in the image AND are written at runtime
      # (data -> juiceshop.sqlite, ftp -> legal.md, .well-known/csaf ->
      # provider-metadata.json). An empty volume over any of them hides the
      # shipped files and the app crashes (SQLITE_CANTOPEN / EROFS), so this init
      # container seeds each emptyDir from the image before the app starts.
      initContainers:
        - name: seed-writable-dirs
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          command:
            - /nodejs/bin/node
            - -e
            - |
              const fs=require('fs');
              fs.cpSync('/juice-shop/data','/seed-data',{recursive:true});
              fs.cpSync('/juice-shop/ftp','/seed-ftp',{recursive:true});
              fs.cpSync('/juice-shop/.well-known','/seed-wk',{recursive:true});
              fs.cpSync('/juice-shop/frontend/dist/frontend','/seed-fe',{recursive:true});
          volumeMounts:
            - name: data
              mountPath: /seed-data
            - name: ftp
              mountPath: /seed-ftp
            - name: well-known
              mountPath: /seed-wk
            - name: frontend
              mountPath: /seed-fe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: juice-shop
          # Pinned by digest, not tag (docker inspect .RepoDigests)
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # bonus; restricted does not require it
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data               # seeded: sqlite written next to shipped data files
              mountPath: /juice-shop/data
            - name: ftp                # seeded: app copies legal.md in next to shipped files
              mountPath: /juice-shop/ftp
            - name: well-known         # seeded: provider-metadata.json rewritten at startup
              mountPath: /juice-shop/.well-known
            - name: frontend           # seeded: app rewrites index.html / theme at startup
              mountPath: /juice-shop/frontend/dist/frontend
            - name: logs               # access/audit logs (ships empty)
              mountPath: /juice-shop/logs
            - name: i18n               # merged locale files written at startup
              mountPath: /juice-shop/i18n
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: ftp
          emptyDir: {}
        - name: well-known
          emptyDir: {}
        - name: frontend
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: i18n
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  selector:
    app: juice-shop
  ports:
    - port: 3000
      targetPort: 3000
