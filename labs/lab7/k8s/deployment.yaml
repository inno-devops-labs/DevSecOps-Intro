apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: data-populate
        image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - /nodejs/bin/node
        - -e
        - |
          const fs = require('fs');
          const path = require('path');
          const src = '/juice-shop/data';
          const dst = '/data';
          const copy = (srcDir, dstDir) => {
            fs.mkdirSync(dstDir, { recursive: true });
            for (const name of fs.readdirSync(srcDir)) {
              const srcPath = path.join(srcDir, name);
              const dstPath = path.join(dstDir, name);
              const stat = fs.statSync(srcPath);
              if (stat.isDirectory()) {
                copy(srcPath, dstPath);
              } else {
                fs.copyFileSync(srcPath, dstPath);
              }
            }
          };
          copy(src, dst);
        volumeMounts:
        - name: data
          mountPath: /data
      - name: csaf-populate
        image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - /nodejs/bin/node
        - -e
        - |
          const fs = require('fs');
          const path = require('path');
          const src = '/juice-shop/.well-known/csaf';
          const dst = '/csaf';
          const copy = (srcDir, dstDir) => {
            fs.mkdirSync(dstDir, { recursive: true });
            for (const name of fs.readdirSync(srcDir)) {
              const srcPath = path.join(srcDir, name);
              const dstPath = path.join(dstDir, name);
              const stat = fs.statSync(srcPath);
              if (stat.isDirectory()) {
                copy(srcPath, dstPath);
              } else {
                fs.copyFileSync(srcPath, dstPath);
              }
            }
          };
          if (fs.existsSync(src)) {
            copy(src, dst);
          }
        volumeMounts:
        - name: csaf
          mountPath: /csaf
      - name: frontend-populate
        image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - /nodejs/bin/node
        - -e
        - |
          const fs = require('fs');
          const path = require('path');
          const src = '/juice-shop/frontend/dist';
          const dst = '/frontend-dist';
          const copy = (srcDir, dstDir) => {
            fs.mkdirSync(dstDir, { recursive: true });
            for (const name of fs.readdirSync(srcDir)) {
              const srcPath = path.join(srcDir, name);
              const dstPath = path.join(dstDir, name);
              const stat = fs.statSync(srcPath);
              if (stat.isDirectory()) {
                copy(srcPath, dstPath);
              } else {
                fs.copyFileSync(srcPath, dstPath);
              }
            }
          };
          if (fs.existsSync(src)) {
            copy(src, dst);
          }
        volumeMounts:
        - name: frontend-dist
          mountPath: /frontend-dist
      containers:
      - name: juice-shop
        image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /usr/src/app/logs
        - name: logs
          mountPath: /juice-shop/logs
        - name: ftp
          mountPath: /juice-shop/ftp
        - name: videos
          mountPath: /juice-shop/frontend/dist/frontend/assets/public/videos
        - name: csaf
          mountPath: /juice-shop/.well-known/csaf
        - name: data
          mountPath: /juice-shop/data
        - name: i18n
          mountPath: /juice-shop/i18n
        - name: frontend-dist
          mountPath: /juice-shop/frontend/dist
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: ftp
        emptyDir: {}
      - name: videos
        emptyDir: {}
      - name: csaf
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: i18n
        emptyDir: {}
      - name: frontend-dist
        emptyDir: {}
