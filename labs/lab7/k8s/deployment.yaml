apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-juice-shop-data
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          command:
            - /nodejs/bin/node
            - -e
            - |
              const fs = require('fs');
              const path = require('path');

              function copyContents(src, dst) {
                fs.mkdirSync(dst, { recursive: true });

                if (!fs.existsSync(src)) {
                  return;
                }

                for (const entry of fs.readdirSync(src, { withFileTypes: true })) {
                  const srcPath = path.join(src, entry.name);
                  const dstPath = path.join(dst, entry.name);

                  if (entry.isDirectory()) {
                    copyContents(srcPath, dstPath);
                  } else if (entry.isFile()) {
                    fs.copyFileSync(srcPath, dstPath);
                  }
                }
              }

              copyContents('/juice-shop/data', '/work-data');
              copyContents('/juice-shop/ftp', '/work-ftp');
              copyContents('/juice-shop/frontend/dist', '/work-frontend-dist');
              copyContents('/juice-shop/.well-known', '/work-well-known');
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /work-data
            - name: ftp
              mountPath: /work-ftp
            - name: frontend-dist
              mountPath: /work-frontend-dist
            - name: well-known
              mountPath: /work-well-known
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /juice-shop/logs
            - name: data
              mountPath: /juice-shop/data
            - name: ftp
              mountPath: /juice-shop/ftp
            - name: frontend-dist
              mountPath: /juice-shop/frontend/dist
            - name: well-known
              mountPath: /juice-shop/.well-known
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: ftp
          emptyDir: {}
        - name: frontend-dist
          emptyDir: {}
        - name: well-known
          emptyDir: {}
