apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 0
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-writable-dirs
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          command: ["/nodejs/bin/node"]
          args:
            - "-e"
            - |
              const fs = require('fs');
              const copyDir = (src, dest) => {
                fs.mkdirSync(dest, { recursive: true });
                fs.cpSync(src, dest, { recursive: true, force: true });
              };
              for (const [src, dest] of [
                ['/juice-shop/data', '/data'],
                ['/juice-shop/frontend/dist', '/frontend/dist'],
                ['/juice-shop/ftp', '/ftp'],
                ['/juice-shop/.well-known', '/well-known'],
              ]) {
                copyDir(src, dest);
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: frontend-dist
              mountPath: /frontend/dist
            - name: ftp
              mountPath: /ftp
            - name: well-known
              mountPath: /well-known
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /juice-shop/data
            - name: frontend-dist
              mountPath: /juice-shop/frontend/dist
            - name: ftp
              mountPath: /juice-shop/ftp
            - name: well-known
              mountPath: /juice-shop/.well-known
            - name: i18n
              mountPath: /juice-shop/i18n
            - name: logs
              mountPath: /juice-shop/logs
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: frontend-dist
          emptyDir: {}
        - name: ftp
          emptyDir: {}
        - name: well-known
          emptyDir: {}
        - name: i18n
          emptyDir: {}
        - name: logs
          emptyDir: {}
