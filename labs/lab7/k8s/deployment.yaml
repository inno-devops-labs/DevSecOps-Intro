apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ftp
              mountPath: /juice-shop/ftp
            - name: i18n
              mountPath: /juice-shop/i18n
            - name: data
              mountPath: /juice-shop/data
            - name: logs
              mountPath: /juice-shop/logs
            - name: frontend
              mountPath: /juice-shop/frontend/dist/frontend
            - name: well-known
              mountPath: /juice-shop/.well-known
      initContainers:
        - name: seed-writable
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          imagePullPolicy: IfNotPresent
          command:
            - /nodejs/bin/node
            - -e
            - |
              const fs = require('fs');
              const path = require('path');
              function cp(src, dst) {
                fs.mkdirSync(dst, { recursive: true });
                for (const e of fs.readdirSync(src, { withFileTypes: true })) {
                  const s = path.join(src, e.name), d = path.join(dst, e.name);
                  if (e.isDirectory()) cp(s, d); else fs.copyFileSync(s, d);
                }
              }
              for (const [src, dst] of [
                ['/juice-shop/ftp', '/seed-ftp'],
                ['/juice-shop/i18n', '/seed-i18n'],
                ['/juice-shop/data', '/seed-data'],
                ['/juice-shop/frontend/dist/frontend', '/seed-frontend'],
                ['/juice-shop/.well-known', '/seed-well-known'],
              ]) {
                if (fs.existsSync(src)) cp(src, dst);
                else fs.mkdirSync(dst, { recursive: true });
              }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ftp
              mountPath: /seed-ftp
            - name: i18n
              mountPath: /seed-i18n
            - name: data
              mountPath: /seed-data
            - name: frontend
              mountPath: /seed-frontend
            - name: well-known
              mountPath: /seed-well-known
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ftp
          emptyDir: {}
        - name: i18n
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: frontend
          emptyDir: {}
        - name: well-known
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  selector:
    app: juice-shop
  ports:
    - port: 3000
      targetPort: 3000
      name: http
