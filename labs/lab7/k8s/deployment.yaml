apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: seed-writable-volumes
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0

          command:
            - /nodejs/bin/node
          args:
            - -e
            - |
              const fs = require('fs');

              const copies = [
                ['/juice-shop/data', '/seed/data'],
                ['/juice-shop/ftp', '/seed/ftp'],
                ['/juice-shop/i18n', '/seed/i18n'],
                ['/juice-shop/frontend/dist/frontend', '/seed/frontend'],
                ['/juice-shop/.well-known/csaf', '/seed/csaf']
              ];

              for (const [src, dst] of copies) {
                console.log(`Seeding ${src} -> ${dst}`);

                for (const entry of fs.readdirSync(src)) {
                  fs.cpSync(
                    `${src}/${entry}`,
                    `${dst}/${entry}`,
                    {
                      recursive: true,
                      force: true
                    }
                  );
                }
              }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            - name: data
              mountPath: /seed/data
            - name: ftp
              mountPath: /seed/ftp
            - name: i18n
              mountPath: /seed/i18n
            - name: frontend
              mountPath: /seed/frontend
            - name: csaf
              mountPath: /seed/csaf

      containers:
        - name: juice-shop
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0

          ports:
            - containerPort: 3000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /juice-shop/data
            - name: logs
              mountPath: /juice-shop/logs
            - name: ftp
              mountPath: /juice-shop/ftp
            - name: i18n
              mountPath: /juice-shop/i18n
            - name: frontend
              mountPath: /juice-shop/frontend/dist/frontend
            - name: csaf
              mountPath: /juice-shop/.well-known/csaf

      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: ftp
          emptyDir: {}
        - name: i18n
          emptyDir: {}
        - name: frontend
          emptyDir: {}
        - name: csaf
          emptyDir: {}
