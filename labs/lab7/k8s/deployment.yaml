apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's own user: docker inspect ... --format '{{.Config.User}}' -> 65532
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Bonus: readOnlyRootFilesystem. `docker diff` shows Juice Shop writing into six
      # directories at startup. Four of them also hold files shipped in the image, so an
      # empty volume would hide those files (an empty data/ loses data/static/ and the app
      # exits). This init container copies the image's own content into the volumes
      # first. The image is distroless (no shell, no cp), so the copy uses its Node.
      initContainers:
        - name: seed-writable-dirs
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          command:
            - /nodejs/bin/node
            - -e
            - |
              const fs = require("fs");
              for (const [src, dst] of [
                ["/juice-shop/data", "/seed/data"],
                ["/juice-shop/ftp", "/seed/ftp"],
                ["/juice-shop/.well-known", "/seed/well-known"],
                ["/juice-shop/frontend/dist/frontend", "/seed/frontend"],
              ]) {
                fs.cpSync(src, dst, { recursive: true });
                console.log("seeded " + dst + " from " + src);
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /seed/data
            - name: ftp
              mountPath: /seed/ftp
            - name: well-known
              mountPath: /seed/well-known
            - name: frontend
              mountPath: /seed/frontend
      containers:
        - name: juice-shop
          # v20.0.0, pinned by digest (same digest as Lab 4)
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # seeded: shipped content + runtime writes
            - name: data          # juiceshop.sqlite is created next to data/static/
              mountPath: /juice-shop/data
            - name: ftp           # app copies data/static/legal.md -> ftp/legal.md
              mountPath: /juice-shop/ftp
            - name: well-known    # csaf/provider-metadata.json is rewritten at startup
              mountPath: /juice-shop/.well-known
            - name: frontend      # index.html rewritten (title/theme), images copied in
              mountPath: /juice-shop/frontend/dist/frontend
            # empty in the image, so a plain emptyDir is enough
            - name: logs          # access.log.<date>, audit.json
              mountPath: /juice-shop/logs
            - name: i18n          # 43 translation files generated at startup
              mountPath: /juice-shop/i18n
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: ftp
          emptyDir:
            sizeLimit: 16Mi
        - name: well-known
          emptyDir:
            sizeLimit: 1Mi
        - name: frontend
          emptyDir:
            sizeLimit: 128Mi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: i18n
          emptyDir:
            sizeLimit: 8Mi
