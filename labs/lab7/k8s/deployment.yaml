apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # docker inspect ... --format '{{.Config.User}}'
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Bonus: the image ships files in directories the app also writes to at
      # runtime, so an empty volume over them hides those files and the app exits.
      # This initContainer copies the shipped content into emptyDirs first.
      initContainers:
        - name: seed-writable-dirs
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          command: ["/nodejs/bin/node", "-e"]
          args:
            - |
              const fs = require("fs");
              for (const [src, dst] of [
                ["/juice-shop/data", "/seed/data"],
                ["/juice-shop/ftp", "/seed/ftp"],
                ["/juice-shop/i18n", "/seed/i18n"],
                ["/juice-shop/.well-known", "/seed/well-known"],
                ["/juice-shop/frontend/dist", "/seed/frontend-dist"],
              ]) { fs.cpSync(src, dst, { recursive: true }); console.log("seeded", dst); }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - { name: data,          mountPath: /seed/data }
            - { name: ftp,           mountPath: /seed/ftp }
            - { name: i18n,          mountPath: /seed/i18n }
            - { name: well-known,    mountPath: /seed/well-known }
            - { name: frontend-dist, mountPath: /seed/frontend-dist }
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop@sha256:fd58bdc9745416afce8184ee0666278a436574633ea7880365153a63bfd418b0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - { name: data,          mountPath: /juice-shop/data }
            - { name: ftp,           mountPath: /juice-shop/ftp }
            - { name: i18n,          mountPath: /juice-shop/i18n }
            - { name: well-known,    mountPath: /juice-shop/.well-known }
            - { name: frontend-dist, mountPath: /juice-shop/frontend/dist }
            - { name: logs,          mountPath: /juice-shop/logs }
      volumes:
        - { name: data,          emptyDir: { sizeLimit: 256Mi } }
        - { name: ftp,           emptyDir: { sizeLimit: 32Mi } }
        - { name: i18n,          emptyDir: { sizeLimit: 32Mi } }
        - { name: well-known,    emptyDir: { sizeLimit: 8Mi } }
        - { name: frontend-dist, emptyDir: { sizeLimit: 128Mi } }
        - { name: logs,          emptyDir: { sizeLimit: 64Mi } }
