# YOUR TASK: default-deny + allow-ingress-from-localhost
# Requirements (Lecture 7 slide 15):
#   - podSelector matching app=juice-shop
#   - policyTypes: [Ingress, Egress]
#   - ingress: explicitly allow from-namespace-ingress-controller-or-localhost-port-forward
#   - egress: explicitly allow DNS (UDP 53 to kube-system) and HTTPS (TCP 443) — nothing else

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop-network-policy
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 127.0.0.1/32
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
