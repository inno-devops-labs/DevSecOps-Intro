apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop-default-deny
  namespace: juice-shop
spec:
  # Applies to the app pod only.
  podSelector:
    matchLabels:
      app: juice-shop
  # Naming both types with the rules below means: deny all ingress and egress
  # except what is explicitly re-opened here.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the app's HTTP port. Left open to any source in the cluster because
    # there is no dedicated client here; tighten with a namespaceSelector /
    # podSelector once a real caller exists.
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution against CoreDNS in kube-system. Nothing else: Juice Shop
    # uses an in-container SQLite DB and makes no other outbound calls.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
