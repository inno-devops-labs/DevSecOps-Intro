apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes: [Ingress, Egress]
  # Access for this lab uses kubectl port-forward; no pod ingress is needed.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
