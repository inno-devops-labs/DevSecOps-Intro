apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP on the app port, only from pods in this namespace. Nothing else in the
    # cluster needs to reach the app; kubectl port-forward enters the pod network
    # namespace through the kubelet and is not subject to this policy.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS to CoreDNS in kube-system. No other egress: the startup checks for
    # alchemy.com and a local LLM endpoint only log warnings when unreachable.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
