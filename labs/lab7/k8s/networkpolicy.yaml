apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop-default-deny
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only inbound traffic to the app's HTTP port (from within the cluster /
    # port-forward). Everything else is denied by the empty default.
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution to kube-system CoreDNS only; no other egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
