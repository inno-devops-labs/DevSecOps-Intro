apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop-default-deny
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  # Selecting both types with the rules below = default-deny, then poke holes.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow traffic to the app port. Any-namespace covers an ingress
    # controller or a `kubectl port-forward` reaching the pod on 3000.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution (kube-dns lives in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS only — nothing else leaves the pod.
    - to: []
      ports:
        - protocol: TCP
          port: 443
