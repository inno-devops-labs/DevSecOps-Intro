apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop-default-deny
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP for kubectl port-forward and local access
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution via kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # External HTTPS (image updates, optional runtime fetches)
    - ports:
        - protocol: TCP
          port: 443
