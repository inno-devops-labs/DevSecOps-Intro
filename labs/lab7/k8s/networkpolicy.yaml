# Default-deny for the app pod, then re-open only what it needs.
# A NetworkPolicy that selects a pod but lists no rule for a direction
# denies all traffic in that direction; the two blocks below are the
# minimum re-opened on top of that deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only inbound HTTP to the app port. Left open to any source because
    # kubectl port-forward and a Service front this on 3000; tighten the
    # source with a namespaceSelector once a real ingress controller fronts it.
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS to kube-system CoreDNS only. Juice Shop is self-contained (SQLite,
    # local files), so it needs name resolution and nothing else outbound.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
