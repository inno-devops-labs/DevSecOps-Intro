apiVersion: v1
kind: ServiceAccount
metadata:
  name: juice-shop-sa
  namespace: juice-shop
# Anti-pattern to avoid (Lecture 7 slide 12): mounting the SA token into a
# workload that never calls the Kubernetes API. Juice Shop doesn't, so we
# refuse the token at the SA level (and again at pod level, defence in depth).
automountServiceAccountToken: false
