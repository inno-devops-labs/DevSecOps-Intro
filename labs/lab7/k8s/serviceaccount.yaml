# YOUR TASK: Juice Shop Deployment with FULL hardening
# Requirements (all required for PSS restricted compliance):
#   - serviceAccountName: <your dedicated SA>
#   - automountServiceAccountToken: false
#   - pod-level securityContext:
#       runAsNonRoot: true
#       runAsUser: 1000      # Juice Shop runs as UID 1000 by default
#       fsGroup: 1000
#       seccompProfile: { type: RuntimeDefault }
#   - container-level securityContext:
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true       # See pitfalls — Juice Shop writes /tmp
#       capabilities: { drop: ["ALL"] }
#   - resources.limits.{memory,cpu} + resources.requests.{memory,cpu}
#   - image pinned by digest: bkimminich/juice-shop@sha256:<from your Lab 4 capture>
#
# Hint: readOnlyRootFilesystem=true breaks Juice Shop. Mount emptyDir
#       at /tmp, /usr/src/app/logs, and any other path Juice Shop writes to.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: juice-shop
        image: bkimminich/juice-shop@sha256:c5f45c9e6e6c3e6b3e6b3e6b3e6b3e6b3e6b3e6b3e6b3e6b3e6b3e6b3e6b3e
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /usr/src/app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
