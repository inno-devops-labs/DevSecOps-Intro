# Dedicated ServiceAccount for the app. Juice Shop never calls the
# Kubernetes API, so it has no business holding a mounted API token —
# disabling the mount removes a credential an attacker could otherwise
# steal from inside the pod. Set on both the SA and the pod spec because
# the pod-level setting wins and makes the intent explicit either way.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juice-shop
  namespace: juice-shop
automountServiceAccountToken: false
