- rule: Container Write Under Tmp
  desc: Detect a successful writable file open under /tmp inside a container.
  condition: >
    open_write and container.id != host and fd.name startswith /tmp/
  output: >
    Container opened a temporary file for writing
    (container=%container.name user=%user.name file=%fd.name command=%proc.cmdline)
  priority: WARNING
  tags: [container, drift]

- rule: Possible Container Mining Connection
  desc: Detect a miner-named process connecting to a common mining pool port, including refused attempts.
  condition: >
    evt.type=connect and evt.dir=< and container.id != host
    and (fd.sport in (3333, 4444, 5555, 7777, 14444)
      or (evt.failed=true and
        (evt.arg.addr endswith :3333 or evt.arg.addr endswith :4444
         or evt.arg.addr endswith :5555 or evt.arg.addr endswith :7777
         or evt.arg.addr endswith :14444)))
    and proc.name in (xmrig, minerd, cpuminer, nc, ncat)
  output: >
    Possible mining connection
    (container=%container.name process=%proc.name command=%proc.cmdline
     destination=%evt.arg.addr sport=%fd.sport result=%evt.res)
  priority: CRITICAL
  tags: [container, network, mitre_command_and_control]
