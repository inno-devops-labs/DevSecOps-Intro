# Lab 9 — custom Falco rules (loaded from /etc/falco/rules.d/)

# --- Task 1: detect writes to /tmp inside any container ---
- rule: Write to /tmp by container
  desc: A process inside a container wrote to /tmp — often container drift / dropped tooling.
  condition: >
    open_write and container and fd.name startswith /tmp/
  output: >
    Write to /tmp by container
    (container=%container.name user=%user.name file=%fd.name cmd=%proc.cmdline image=%container.image.repository)
  priority: WARNING
  tags: [container, drift]

# --- Bonus: detect cryptominer network/process pattern (>=2 indicators) ---
- rule: Possible Cryptominer Activity
  desc: >
    Container either connected to a well-known mining-pool port OR ran a known miner binary.
    Combines two independent indicators (destination port + process name).
  # Two independent indicators OR'd: a known miner process name, or a connection whose
  # server port is a well-known mining-pool port. (Note: matching proc.name directly rather
  # than via the `spawned_process` macro — the macro's execve-exit gating did not fire in
  # testing, whereas a plain proc.name match catches the miner on its first syscall.)
  condition: >
    container and
    (
      proc.name in (xmrig, ethminer, cgminer, minerd, nbminer, "t-rex", claymore)
      or
      fd.sport in (3333, 4444, 5555, 7777, 14444, 19999, 45700)
    )
  output: >
    Possible cryptominer activity
    (container=%container.name proc=%proc.name cmd=%proc.cmdline target=%fd.name port=%fd.sport)
  priority: CRITICAL
  tags: [container, mitre_execution, mitre_command_and_control]
