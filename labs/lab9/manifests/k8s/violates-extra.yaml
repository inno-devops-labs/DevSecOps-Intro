apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-violates-extra
spec:
  replicas: 1
  selector:
    matchLabels: { app: juice-bad }
  template:
    metadata:
      labels: { app: juice-bad }
    spec:
      containers:
        - name: juice
          image: bkimminich/juice-shop:v20.0.0
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 60
