# Written to violate labs/lab9/policies/extra/hardening.rego and nothing else.
# The main container is juice-hardened.yaml with two changes:
#   - image referenced by tag instead of digest      -> deny
#   - NET_ADMIN added back after drop: ["ALL"]        -> warn
# The init container is also referenced by tag. The shipped rules never look
# at initContainers, so it passes them with no securityContext at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-violates-extra
spec:
  replicas: 1
  selector:
    matchLabels: { app: juice }
  template:
    metadata:
      labels: { app: juice }
    spec:
      initContainers:
        - name: init-wait
          image: busybox:1.36
          command: ["sh", "-c", "true"]
      containers:
        - name: juice
          image: bkimminich/juice-shop:v19.0.0
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
